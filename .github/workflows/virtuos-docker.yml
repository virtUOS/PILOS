name: virtUOS Docker build

on:
  workflow_dispatch:
  pull_request:

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version to tag name
        if: ${{ github.event_name == 'release' }}
        run: echo "${GITHUB_REF_NAME}" > version

      - name: Set version to commit short hash
        if: ${{ github.event_name != 'release' }}
        run: echo "${GITHUB_SHA}" | cut -c1-7 > version

      - name: downcase REPO
        run: |
          echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set image tag
        run: |
          # head_ref is only set on pull_request events; fall back to ref_name
          REF="${{ github.head_ref || github.ref_name }}"
          # Replace slashes and other invalid Docker tag characters with dashes
          TAG=$(echo "$REF" | tr '/' '-' | sed 's/[^a-zA-Z0-9._-]/-/g' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          file: docker/app/Dockerfile
          context: .
          push: true
          tags: "ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
